name: Build MaZze APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - {name: Accept Android SDK licenses, run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true'}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - {name: Restore signing key from secret, env: {KS: "${{ secrets.DEBUG_KEYSTORE_B64 }}"}, run: "[ -z \"$KS\" ] || echo \"$KS\" | base64 -d > debug.keystore"}
      - name: Add Gradle project files that AI Studio keeps hidden
        run: |
          [ -f settings.gradle.kts ] || cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MaZze"
          include(":app")
          EOF
          [ -f build.gradle.kts ] || cat > build.gradle.kts <<'EOF'
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.compose) apply false
              alias(libs.plugins.google.devtools.ksp) apply false
              alias(libs.plugins.secrets) apply false
              alias(libs.plugins.google.services) apply false
          }
          EOF
          [ -f gradle.properties ] || printf "org.gradle.jvmargs=-Xmx4g\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\nkotlin.code.style=official\n" > gradle.properties
          [ -f .env.example ] || touch .env.example
          [ -f debug.keystore ] || keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - {name: Add missing Android resources, run: "H='<?xml version=\"1.0\" encoding=\"utf-8\"?>'; R=app/src/main/res; mkdir -p $R/xml $R/mipmap-anydpi $R/mipmap-anydpi-v26 $R/values; printf '%s%s' \"$H\" '<full-backup-content><include domain=\"sharedpref\" path=\".\"/></full-backup-content>' > $R/xml/backup_rules.xml; printf '%s%s' \"$H\" '<data-extraction-rules><cloud-backup><include domain=\"sharedpref\" path=\".\"/></cloud-backup></data-extraction-rules>' > $R/xml/data_extraction_rules.xml; printf '%s%s' \"$H\" '<layer-list xmlns:android=\"http://schemas.android.com/apk/res/android\"><item android:drawable=\"@drawable/ic_launcher_background\"/><item android:drawable=\"@drawable/ic_launcher_foreground\"/></layer-list>' > $R/mipmap-anydpi/ic_launcher.xml; cp $R/mipmap-anydpi/ic_launcher.xml $R/mipmap-anydpi/ic_launcher_round.xml; printf '%s%s' \"$H\" '<adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\"><background android:drawable=\"@drawable/ic_launcher_background\"/><foreground android:drawable=\"@drawable/ic_launcher_foreground\"/></adaptive-icon>' > $R/mipmap-anydpi-v26/ic_launcher.xml; cp $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml; [ -f $R/values/themes.xml ] || printf '%s%s' \"$H\" '<resources><style name=\"Theme.MyApplication\" parent=\"android:Theme.Material.Light.NoActionBar\"/></resources>' > $R/values/themes.xml"}
      - {name: Add Typography file if missing, run: "F=app/src/main/java/com/example/ui/theme/Type.kt; [ -f $F ] || echo 'package com.example.ui.theme; import androidx.compose.material3.Typography; val Typography = Typography()' > $F"}
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish APK to release MaZze-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MaZze.apk
          gh release delete MaZze-latest --yes --cleanup-tag || true
          gh release create MaZze-latest MaZze.apk --title "MaZze Player (latest build)" --notes "Automated build ${{ github.run_number }}"
